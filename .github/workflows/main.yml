name: Daily Video
on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install edge-tts moviepy==1.0.3 google-generativeai requests pillow
      - run: python main.py
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: final-video
          path: final.mp4
