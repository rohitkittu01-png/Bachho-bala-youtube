name: Daily Video
on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install edge-tts requests
      - run: python main.py
      - uses: actions/upload-artifact@v4
        with:
          name: final-video
          path: final.mp4
